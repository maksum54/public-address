name: Build add-in

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/PublicAddress/PublicAddress.csproj -c Release

      - name: Package
        shell: pwsh
        run: |
          $out = "src/PublicAddress/bin/Release/net8.0-windows"
          New-Item -ItemType Directory -Force -Path pkg/PublicAddress | Out-Null
          Copy-Item "$out/*" pkg/PublicAddress -Recurse
          Copy-Item src/PublicAddress/PublicAddress.addin pkg/

      - uses: actions/upload-artifact@v4
        with:
          name: PublicAddress-Revit2025
          path: pkg/
